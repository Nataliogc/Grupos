<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Groups - Login</title>
    <link rel="icon" type="image/png" href="Nexus Groups/Nexus_Groups_ICO-removebg-preview.png">
    <!-- Static Styles (Tailwind Compiled) -->
    <link rel="stylesheet" href="style.css">

    <!-- Lucide Icons (Local con fallback a CDN) -->
    <script src="js/vendor/lucide.min.js"></script>
    <script>
        if (typeof lucide === "undefined") {
            document.write('<script src="https://unpkg.com/lucide@latest"><\/script>');
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }

        .gradient-text {
            background: linear-gradient(135deg, #2d5a43 0%, #1e3a2c 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-focus:focus {
            border-color: #2d5a43;
            box-shadow: 0 0 0 4px rgba(45, 90, 67, 0.1);
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .login-input-wrapper {
            position: relative;
            width: 100%;
        }

        .login-input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: #94a3b8;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .login-input {
            width: 100%;
            height: 48px;
            box-sizing: border-box;
            padding-left: 44px !important;
            padding-right: 16px !important;
            background: rgba(255, 255, 255, 0.75);
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            outline: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .login-input.has-toggle {
            padding-right: 44px !important;
        }

        .login-input:focus {
            background: #ffffff;
            border-color: #2d5a43;
            box-shadow: 0 0 0 4px rgba(45, 90, 67, 0.12);
        }

        .login-input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .toggle-password-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            background: transparent;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            z-index: 2;
        }

        .toggle-password-btn:hover {
            color: #334155;
            background: rgba(226, 232, 240, 0.6);
        }

        .user-chip {
            flex: 1;
            padding: 8px 4px;
            font-size: 11px;
            font-weight: 700;
            color: #475569;
            background: rgba(255, 255, 255, 0.65);
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
        }

        .user-chip:hover {
            background: rgba(45, 90, 67, 0.08);
            border-color: #2d5a43;
            color: #2d5a43;
            transform: translateY(-1px);
        }

        .user-chip.active {
            background: #2d5a43;
            border-color: #2d5a43;
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(45, 90, 67, 0.25);
        }
    </style>
</head>

<body>
    <div class="relative w-full max-w-md px-4">
        <!-- Decoración de fondo -->
        <div class="absolute -top-20 -left-20 w-64 h-64 bg-emerald-200/30 rounded-full blur-3xl animate-pulse"></div>
        <div
            class="absolute -bottom-20 -right-20 w-64 h-64 bg-blue-200/30 rounded-full blur-3xl animate-pulse animate-float-delayed">
        </div>

        <div class="glass-card rounded-[2.5rem] p-10 relative z-10">
            <div class="text-center mb-10">
                <div
                    class="w-24 h-24 bg-white/50 rounded-3xl mx-auto mb-6 flex items-center justify-center shadow-2xl shadow-emerald-900/10 animate-float overflow-hidden p-2">
                    <img src="Nexus Groups/Nexus_Groups_ICO-removebg-preview.png" class="w-full h-full object-contain"
                        alt="Nexus Groups Logo">
                </div>
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Nexus <span
                        class="gradient-text">Groups</span></h1>
                <p class="text-slate-500 text-sm mt-2">Inteligencia Hotelera Estratégica</p>
            </div>

            <form id="loginForm" class="space-y-4" novalidate>
                <!-- Selección rápida de cuenta -->
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">
                        Acceso Rápido
                    </label>
                    <div class="flex items-center gap-1.5" id="userChipsContainer">
                        <button type="button" class="user-chip" data-user="Diana" data-email="dianahotelguadiana@gmail.com">Diana</button>
                        <button type="button" class="user-chip" data-user="Sergio" data-email="ssanchez@hotelguadiana.es">Sergio</button>
                        <button type="button" class="user-chip" data-user="Oscar" data-email="osanchez@hotelguadiana.es">Oscar</button>
                        <button type="button" class="user-chip" data-user="Natalio" data-email="comunicaciones@hotelguadiana.es">Natalio</button>
                    </div>
                </div>

                <!-- Usuario o Correo -->
                <div>
                    <label for="username"
                        class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">
                        Usuario o Correo
                    </label>
                    <div class="login-input-wrapper">
                        <div class="login-input-icon">
                            <i data-lucide="user" class="w-4 h-4 text-slate-400"></i>
                        </div>
                        <input type="text" id="username" name="username"
                            placeholder="Tu correo o nombre de usuario"
                            autocomplete="username"
                            aria-label="Introduce tu usuario o correo electrónico"
                            class="login-input"
                            required>
                    </div>
                </div>

                <!-- Contraseña -->
                <div>
                    <label for="password"
                        class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">
                        Contraseña
                    </label>
                    <div class="login-input-wrapper">
                        <div class="login-input-icon">
                            <i data-lucide="lock" class="w-4 h-4 text-slate-400"></i>
                        </div>
                        <input type="password" id="password" name="password"
                            placeholder="Introduce tu contraseña"
                            autocomplete="current-password"
                            aria-label="Introduce tu contraseña de acceso"
                            class="login-input has-toggle"
                            required>
                        <button type="button" id="togglePasswordBtn" class="toggle-password-btn"
                            tabindex="-1" aria-label="Mostrar u ocultar contraseña">
                            <i data-lucide="eye" class="w-4 h-4" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Recordar credenciales -->
                <div class="flex items-center justify-between px-1 py-0.5">
                    <label class="flex items-center gap-2 cursor-pointer text-xs font-medium text-slate-600 select-none">
                        <input type="checkbox" id="rememberMe"
                            class="w-4 h-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 transition-all cursor-pointer">
                        <span>Recordar usuario</span>
                    </label>
                    <span class="text-[10px] text-slate-400 font-semibold tracking-wider uppercase">Nexus Groups</span>
                </div>

                <!-- Mensaje de error -->
                <div id="errorMessage" role="alert"
                    class="hidden text-red-600 text-xs font-semibold text-center bg-red-50/95 py-2.5 px-3 rounded-xl border border-red-200">
                    <span id="errorText">Usuario o contraseña incorrectos.</span>
                </div>

                <!-- Botón Submit -->
                <div class="pt-1">
                    <button type="submit" id="submitBtn"
                        class="w-full relative bg-[#2d5a43] hover:bg-[#1e3a2c] text-white py-3.5 rounded-xl font-bold text-sm shadow-lg shadow-emerald-900/20 transition-all active:scale-[0.98] flex items-center justify-center gap-2.5 cursor-pointer">
                        <span class="btn-text">Entrar al Centro de Control</span>
                        <i data-lucide="arrow-right" class="w-4 h-4 btn-text" aria-hidden="true"></i>
                        <span class="btn-spinner hidden" aria-hidden="true"></span>
                    </button>
                </div>
            </form>

            <div class="mt-10 pt-8 border-t border-slate-100 flex justify-between items-center opacity-40">
                <img src="Logos/Sercotel Guadiana.jpg" class="h-6 grayscale object-contain" alt="Guadiana">
                <img src="Logos/Cumbria Spa&Hotel.jpg" class="h-6 grayscale object-contain" alt="Cumbria">
            </div>
        </div>

        <p class="text-center text-slate-400 text-[10px] mt-8 font-medium uppercase tracking-[0.2em]">Nexus Groups v1.0
            • Sistema Unificado Cloud 2026</p>
    </div>

    <!-- Firebase SDK (Compat mode - Local con fallback a CDN) -->
    <script src="js/vendor/firebase-app-compat.js"></script>
    <script src="js/vendor/firebase-firestore-compat.js"></script>
    <script>
        if (typeof firebase === "undefined") {
            document.write('<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"><\/script>');
            document.write('<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"><\/script>');
        }
    </script>

    <!-- Configuración Firebase Centralizada -->
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>

    <script>
        // ─── USUARIOS AUTORIZADOS NEXUSGROUPS ─────────────────────────────────
        const AUTHORIZED_USERS = [
            { id: "diana", email: "dianahotelguadiana@gmail.com", pass: "1234", name: "Diana", role: "Comercial" },
            { id: "sergio", email: "ssanchez@hotelguadiana.es", pass: "1234", name: "Sergio", role: "Dirección" },
            { id: "oscar", email: "osanchez@hotelguadiana.es", pass: "1234", name: "Oscar", role: "Dirección" },
            { id: "natalio", email: "comunicaciones@hotelguadiana.es", pass: "1234", name: "Natalio", role: "Administrador" }
        ];

        // Inicialización segura de Lucide con iconos de fallback
        function refreshIcons() {
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons();
            } else {
                document.querySelectorAll('[data-lucide="user"]').forEach(function(el) {
                    el.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
                });
                document.querySelectorAll('[data-lucide="lock"]').forEach(function(el) {
                    el.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
                });
                document.querySelectorAll('[data-lucide="eye"]').forEach(function(el) {
                    el.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
                });
                document.querySelectorAll('[data-lucide="eye-off"]').forEach(function(el) {
                    el.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>';
                });
                document.querySelectorAll('[data-lucide="arrow-right"]').forEach(function(el) {
                    el.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
                });
            }
        }
        refreshIcons();

        // Elementos del DOM
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const rememberMeCheckbox = document.getElementById('rememberMe');
        const userChips = document.querySelectorAll('.user-chip');
        const errorMsg = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = submitBtn.querySelector('.btn-text');
        const btnSpinner = submitBtn.querySelector('.btn-spinner');

        const REDIRECT_URL = "Admin.html";

        // Parámetros de URL (logout o acceso directo)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('logout') === 'true') {
            try {
                localStorage.removeItem('nexus_user');
                sessionStorage.removeItem('nexus_session');
            } catch(e) {}
        }

        // Selección rápida mediante chips de usuario
        userChips.forEach(chip => {
            chip.addEventListener('click', function() {
                const userKey = this.getAttribute('data-user');
                usernameInput.value = userKey;
                userChips.forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                showError(false);
                passwordInput.focus();
            });
        });

        // Sincronizar estado de chips al escribir manualmente en el input
        usernameInput.addEventListener('input', function() {
            const val = this.value.trim().toLowerCase();
            userChips.forEach(chip => {
                const u = chip.getAttribute('data-user').toLowerCase();
                const em = (chip.getAttribute('data-email') || '').toLowerCase();
                if (val === u || val === em) {
                    chip.classList.add('active');
                } else {
                    chip.classList.remove('active');
                }
            });
        });

        // Cargar usuario recordado
        try {
            const savedUsername = localStorage.getItem('nexus_saved_username');
            if (savedUsername) {
                usernameInput.value = savedUsername;
                rememberMeCheckbox.checked = true;
                const savedLow = savedUsername.trim().toLowerCase();
                userChips.forEach(chip => {
                    const u = chip.getAttribute('data-user').toLowerCase();
                    const em = (chip.getAttribute('data-email') || '').toLowerCase();
                    if (savedLow === u || savedLow === em) {
                        chip.classList.add('active');
                    }
                });
                setTimeout(() => passwordInput.focus(), 100);
            } else {
                usernameInput.focus();
            }
        } catch(e) {
            usernameInput.focus();
        }

        // Alternar visibilidad de contraseña
        if (togglePasswordBtn) {
            togglePasswordBtn.addEventListener('click', function() {
                const isPass = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPass ? 'text' : 'password');
                const eyeIcon = document.getElementById('eyeIcon');
                if (eyeIcon) {
                    eyeIcon.setAttribute('data-lucide', isPass ? 'eye-off' : 'eye');
                    refreshIcons();
                }
            });
        }

        // Sincronizar chips con usuarios actualizados en Firestore (altas y revocaciones)
        async function syncCloudUserChips() {
            if (!window.db || typeof window.db.collection !== "function") return;
            try {
                const doc = await window.db.collection("settings").doc("main").get();
                if (!doc || !doc.exists) return;
                const data = doc.data();
                if (!data || !data.system || !Array.isArray(data.system.users)) return;

                const container = document.getElementById('userChipsContainer');
                if (!container) return;

                const cloudUsers = data.system.users;

                // Actualizar chips existentes (marcar tachados los revocados)
                container.querySelectorAll('.user-chip').forEach(chip => {
                    const userKey = (chip.getAttribute('data-user') || '').toLowerCase();
                    const emailKey = (chip.getAttribute('data-email') || '').toLowerCase();
                    const found = cloudUsers.find(cu => 
                        (cu.name && cu.name.toLowerCase() === userKey) ||
                        (cu.email && cu.email.toLowerCase() === emailKey) ||
                        (cu.id && cu.id.toLowerCase() === userKey)
                    );
                    if (found) {
                        if (found.revoked === true || found.active === false) {
                            chip.classList.add('opacity-40', 'line-through');
                            chip.title = "Acceso revocado por el administrador";
                        } else {
                            chip.classList.remove('opacity-40', 'line-through');
                            chip.removeAttribute('title');
                        }
                    }
                });

                // Añadir chips para nuevos usuarios si no existen ya
                cloudUsers.forEach(cu => {
                    if (!cu.name) return;
                    const cuNameLow = cu.name.toLowerCase();
                    const cuEmailLow = (cu.email || '').toLowerCase();
                    const exists = Array.from(container.querySelectorAll('.user-chip')).some(chip => {
                        const u = (chip.getAttribute('data-user') || '').toLowerCase();
                        const em = (chip.getAttribute('data-email') || '').toLowerCase();
                        return u === cuNameLow || (cuEmailLow && em === cuEmailLow);
                    });
                    if (!exists) {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'user-chip';
                        btn.setAttribute('data-user', cu.name);
                        if (cu.email) btn.setAttribute('data-email', cu.email);
                        btn.textContent = cu.name;
                        if (cu.revoked === true || cu.active === false) {
                            btn.classList.add('opacity-40', 'line-through');
                            btn.title = "Acceso revocado por el administrador";
                        }
                        btn.addEventListener('click', function() {
                            usernameInput.value = this.getAttribute('data-user');
                            container.querySelectorAll('.user-chip').forEach(c => c.classList.remove('active'));
                            this.classList.add('active');
                            showError(false);
                            passwordInput.focus();
                        });
                        container.appendChild(btn);
                    }
                });
            } catch(e) {
                console.warn("[Login] Error sincronizando chips con la nube:", e);
            }
        }
        syncCloudUserChips();

        function setLoading(loading) {
            submitBtn.classList.toggle('btn-loading', loading);
            submitBtn.disabled = loading;
            if (btnSpinner) btnSpinner.classList.toggle('hidden', !loading);
        }

        function showError(show, message) {
            if (message) errorText.textContent = message;
            errorMsg.classList.toggle('hidden', !show);
            usernameInput.setAttribute('aria-invalid', show ? 'true' : 'false');
            passwordInput.setAttribute('aria-invalid', show ? 'true' : 'false');
        }

        [usernameInput, passwordInput].forEach(input => {
            if (input) {
                input.addEventListener('input', () => showError(false));
            }
        });

        // Envío del formulario
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            showError(false);

            const usernameVal = usernameInput.value.trim().toLowerCase();
            const passwordVal = passwordInput.value.trim();

            if (!usernameVal) {
                usernameInput.focus();
                showError(true, "Por favor, introduce tu usuario o correo.");
                return;
            }

            if (!passwordVal) {
                passwordInput.focus();
                showError(true, "Por favor, introduce tu contraseña.");
                return;
            }

            setLoading(true);

            try {
                // Lista de usuarios válidos con fallback Firestore
                let validUsers = [...AUTHORIZED_USERS];
                if (window.db && typeof window.db.collection === "function") {
                    try {
                        const doc = await window.db.collection("settings").doc("main").get();
                        if (doc && doc.exists) {
                            const data = doc.data();
                            if (data && data.system && Array.isArray(data.system.users) && data.system.users.length > 0) {
                                // Combinar usuarios de la nube sin duplicar emails o nombres
                                data.system.users.forEach(cloudUser => {
                                    if (cloudUser && (cloudUser.email || cloudUser.name)) {
                                        const idx = validUsers.findIndex(u => 
                                            (cloudUser.email && u.email && u.email.toLowerCase() === cloudUser.email.toLowerCase()) ||
                                            (cloudUser.name && u.name && u.name.toLowerCase() === cloudUser.name.toLowerCase()) ||
                                            (cloudUser.id && u.id && u.id.toLowerCase() === cloudUser.id.toLowerCase())
                                        );
                                        if (idx >= 0) {
                                            validUsers[idx] = { ...validUsers[idx], ...cloudUser };
                                        } else {
                                            validUsers.push(cloudUser);
                                        }
                                    }
                                });
                            }
                        }
                    } catch(netErr) {
                        console.warn("[Login] Firestore no accesible, usando usuarios locales:", netErr);
                    }
                }

                // Buscar usuario por correo, nombre o ID de usuario (insensible a mayúsculas/minúsculas)
                const matchedUser = validUsers.find(u => {
                    const email = (u.email || '').toLowerCase();
                    const name = (u.name || '').toLowerCase();
                    const id = (u.id || '').toLowerCase();
                    return email === usernameVal || name === usernameVal || id === usernameVal;
                });

                if (matchedUser) {
                    // Comprobar si el acceso ha sido revocado
                    if (matchedUser.revoked === true || matchedUser.active === false) {
                        setLoading(false);
                        showError(true, "Acceso revocado para esta cuenta. Contacta con el Administrador.");
                        return;
                    }

                    if (String(matchedUser.pass) === passwordVal) {
                        // Login correcto: Guardar sesión
                        const sessionData = {
                            id: matchedUser.id || (matchedUser.name ? matchedUser.name.toLowerCase() : "user"),
                            email: matchedUser.email,
                            name: matchedUser.name,
                            role: matchedUser.role || "Usuario",
                            avatar: (matchedUser.name || 'U').charAt(0).toUpperCase(),
                            loginTime: Date.now()
                        };

                        try {
                            localStorage.setItem('nexus_user', JSON.stringify(sessionData));
                            sessionStorage.setItem('nexus_session', JSON.stringify(sessionData));
                            if (rememberMeCheckbox.checked) {
                                localStorage.setItem('nexus_saved_username', usernameInput.value.trim());
                            } else {
                                localStorage.removeItem('nexus_saved_username');
                            }
                        } catch(storageErr) {
                            console.warn("[Login] Error de almacenamiento de sesión:", storageErr);
                        }

                        window.location.href = REDIRECT_URL;
                        return;
                    }
                }

                // Si no coincide
                setLoading(false);
                showError(true, "Usuario o contraseña incorrectos. Revisa tus datos.");
                passwordInput.value = "";
                passwordInput.focus();

                loginForm.animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-10px)' },
                    { transform: 'translateX(10px)' },
                    { transform: 'translateX(0)' }
                ], { duration: 300 });

            } catch (error) {
                console.warn("Error en proceso de login:", error);
                setLoading(false);
                showError(true, "Error de conexión al verificar credenciales.");
            }
        });
    </script>
</body>

</html>
