<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2d5a43" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Nexus Groups" />
  <link rel="apple-touch-icon" href="Nexus Groups/apple-touch-icon.png" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="icon" type="image/png" href="Nexus Groups/Nexus_Groups_ICO-removebg-preview.png" />

    <!-- Tailwind CSS (CDN necesario para clases dinámicas en JSX) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons (Local con fallback) -->
    <script src="js/vendor/lucide.min.js"></script>
    <script>
      if (typeof lucide === "undefined") {
        document.write('<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"><\/script>');
      }
    </script>

    <!-- React & ReactDOM (Local con fallback) -->
    <script src="js/vendor/react-18.3.1.production.min.js"></script>
    <script>
      if (typeof React === "undefined") {
        document.write('<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"><\/script>');
      }
    </script>
    <script src="js/vendor/react-dom-18.3.1.production.min.js"></script>
    <script>
      if (typeof ReactDOM === "undefined") {
        document.write('<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"><\/script>');
      }
    </script>



    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8fafc;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .sidebar-item-active {
            background: #2d5a43;
            color: white;
            box-shadow: 0 4px 12px rgba(45, 90, 67, 0.3);
        }

        .container, .\!container {
            width: 100% !important;
            max-width: 100% !important;
        }
        .hotel-profile {max-width:1250px;margin:auto;padding:24px clamp(14px,3vw,40px)}
        .hotel-profile > header {margin:0 0 18px;align-items:center;gap:12px;flex-wrap:wrap}
        .hotel-profile h1 {font-size:clamp(22px,3vw,31px)}
        .hotel-profile header button {padding:9px 15px;margin:0;border-radius:10px}
        .hotel-profile header p {margin-top:4px;font-size:14px}
        .hotel-profile main,.hotel-profile .grid > div {min-width:0}
        .hotel-profile > div {border-radius:16px;border-color:#dce4e5}
        .hotel-profile .p-10 {padding:clamp(16px,2.5vw,30px)}
        .hotel-profile h2 {font-size:16px;color:#285b46;font-weight:700;padding-bottom:8px;border-bottom:1px solid #dce4e5}
        .hotel-profile .space-y-6 > * + * {margin-top:16px}
        .hotel-profile label {color:#506174;font-size:11px;margin-left:0}
        .hotel-profile input,.hotel-profile textarea {padding:9px 12px;font-size:14px}
        @media(max-width:700px){.hotel-profile .grid {grid-template-columns:minmax(0,1fr)}}
    </style>
</head>

<body>
    <div id="root"></div>

    <!-- Configuración Firebase Centralizada -->
    <script src="js/firebase-config.js"></script>
    <!-- Módulos Compartidos -->
    <script src="js/utils.js"></script>
    <script src="js/gemini.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/services/budgetStatus.js"></script>
  <script src="js/navigation.js?v=2-shared-listener"></script>
    <script src="js/vendor/firebase-auth-9.22.1-compat.js"></script>
  <script src="js/firebase-init.js?v=2-persistent-cache"></script>
  <style>html:not(.nexus-auth-verified) body { visibility: hidden }</style>
  <script src="js/nexus-auth-guard.staging.js"></script>

    <script src="js/Configuracion.js?v=1.2.0-full-width"></script>
</body>

</html>
