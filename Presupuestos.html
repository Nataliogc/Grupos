  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    body {
      font-family: 'Inter', sans-serif;
    }

    /* Smooth transitions on interactive elements */
    button,
    a,
    input,
    select,
    [role="button"] {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #cbd5e1, #94a3b8);
      border-radius: 10px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    /* Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.35s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-slide-up {
      animation: slideUp 0.4s ease-out;
    }

    /* Card hover lift */
    .card-hover {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.1);
    }

    /* Room cards interactive */
    input[type="number"]:focus {
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }

    /* Button interactions */
    button:active,
    [role="button"]:active {
      transform: scale(0.97);
    }

    /* Focus visible */
    :focus-visible {
      outline: 2px solid #6366f1;
      outline-offset: 2px;
      border-radius: 4px;
    }

    .quote-clause-grid > div { padding-top: 0; padding-bottom: 0; }
    .quote-clause-grid > div > p { font-size: 8px; margin-bottom: 1px; }
    .quote-clause-grid > div > div { font-size: 8px; line-height: 1.2; }

    .quote-payment-plan > div:first-child { padding: 6px 12px; }
    .quote-payment-plan > div:last-child > div { padding: 6px 12px; gap: 8px; font-size: 10px; line-height: 1.2; }
    .quote-payment-plan h4 { font-size: 9px; }
    .quote-payment-plan p { font-size: 9px; line-height: 1.2; }

    @page { size: A4 portrait; margin: 10mm; }

    @media print {
      html, body { margin: 0 !important; padding: 0 !important; }
      body *:has(#quote-document) {
        display: block !important;
        margin: 0 !important;
        padding: 0 !important;
        width: auto !important;
        max-width: none !important;
        min-height: 0 !important;
        border: 0 !important;
        box-shadow: none !important;
        overflow: visible !important;
        zoom: 1 !important;
        transform: none !important;
      }
      body *:has(#quote-document) > :not(:has(#quote-document)):not(#quote-document) {
        display: none !important;
      }
      #quote-document {
        width: 190mm !important;
        padding: 0 !important;
        margin: 0 !important;
        zoom: 1 !important;
        transform: none !important;
        height: auto !important;
        min-height: 0 !important;
        box-sizing: border-box !important;
        font-size: 10pt !important;
        line-height: 1.2 !important;
      }
      #quote-document * {
        font-size: 9pt !important;
        line-height: 1.2 !important;
        letter-spacing: normal !important;
      }
      #quote-document h1 { font-size: 16pt !important; }
      #quote-document h2, #quote-document h3, #quote-document h4 { font-size: 10pt !important; }
      #quote-document table { width: 100% !important; }
      #quote-document th { font-size: 8pt !important; }
      #quote-document li { margin: 0 !important; }
      #quote-document tbody.bg-slate-900 tr:last-child td:last-child { font-size: 15pt !important; }
      #quote-document .quote-clause-grid {
        display: grid !important;
        grid-template-columns: 1fr 1fr !important;
        gap: 3px 12px !important;
        break-inside: avoid;
      }
      #quote-document .quote-clause-grid > div { padding-top: 0 !important; padding-bottom: 0 !important; }
      #quote-document .quote-clause-grid > div > p,
      #quote-document .quote-clause-grid > div > div {
        font-size: 9px !important;
        line-height: 1.15 !important;
      }
      #quote-document .quote-clause-grid * { font-size: 9px !important; line-height: 1.15 !important; }
      #quote-document .quote-payment-plan h4 { font-size: 10px !important; }
      #quote-document .quote-payment-plan > div:first-child { padding: 3px 10px !important; }
      #quote-document .quote-payment-plan > div:last-child > div { padding: 4px 10px !important; }
      #quote-document .quote-payment-plan > div:last-child * { font-size: 9px !important; line-height: 1.15 !important; }
      #quote-document .print-break-before { break-before: auto !important; }
      #quote-document [class*="space-y-"] > :not([hidden]) ~ :not([hidden]) {
        margin-top: 6px !important;
      }
      #quote-document td, #quote-document th { padding-top: 4px !important; padding-bottom: 4px !important; }
      #quote-document .p-4 { padding: 6px !important; }
      #quote-document .mb-8 { margin-bottom: 8px !important; }
      #quote-document .pt-5 { padding-top: 8px !important; }
      #quote-document img { max-height: 42px !important; }

      .no-print {
        display: none !important;
      }

      body {
        background-color: white !important;
      }

      .print-shadow-none {
        box-shadow: none !important;
        border: none !important;
      }

      .print-break-before {
        break-before: page !important;
        display: block !important;
      }

      /* Avoid breaking inside table rows or cards */
      tr, .card, blockquote {
        break-inside: avoid;
      }
    }

    /* Hide number input spin buttons */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .container, .\!container {
      width: 100% !important;
      max-width: 100% !important;
    }
  </style>
